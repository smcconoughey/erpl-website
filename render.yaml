# Deploy this Blueprint once in Render to provision the data subdomain site.
# The existing erpl.space service is managed separately.
services:
  - type: web
    name: erpl-data
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: test -f subdomains/data/index.html
    staticPublishPath: ./subdomains/data
    domains:
      - data.erpl.space
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
