# Deploy this Blueprint once in Render to provision the data subdomain site.
# The existing erpl.space service is managed separately.
#
# Do this in the dashboard BEFORE merging to main (Blueprint will not apply it).
# Current main has no Vite app, so a settings-triggered deploy of main may fail;
# that is expected. Merge second so the first successful deploy is Datanator.
#   Build command:       cd subdomains/data && npm ci && npm run build
#   Publish directory:   ./subdomains/data/dist
#   NODE_VERSION:        22.12.0
services:
  - type: web
    name: erpl-data
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: cd subdomains/data && npm ci && npm run build
    staticPublishPath: ./subdomains/data/dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
    domains:
      - data.erpl.space
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
