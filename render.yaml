# Replacement for the data subdomain's static site only.
# Provision the Node service, configure its password, and upload private CSVs
# before moving data.erpl.space from the old static service. See the data README.
# The existing erpl.space service is managed separately.
services:
  - type: web
    name: erpl-data-server
    runtime: node
    plan: starter
    branch: main
    autoDeployTrigger: commit
    # NODE_ENV=production is also present during builds, so explicitly retain
    # Vite and TypeScript from devDependencies for the frontend compilation.
    buildCommand: cd subdomains/data && npm ci --include=dev && npm run build
    startCommand: cd subdomains/data && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: ERPL_DATA_PASSWORD
        sync: false
      - key: ERPL_SESSION_SECRET
        generateValue: true
      # Trust only the nearest hosting proxy; verify this for your deployment.
      - key: TRUST_PROXY_HOPS
        value: "1"
    disk:
      name: erpl-testdata
      mountPath: /opt/render/project/src/subdomains/data/testdata
      sizeGB: 1
